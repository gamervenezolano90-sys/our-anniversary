<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For Kristine ❤️</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#050711;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.stage{width:min(100vw,1024px);aspect-ratio:1024/1536;margin:auto;position:relative;background:url('invitation-bg.png') center/100% 100% no-repeat;box-shadow:0 0 80px #000}.veil{position:fixed;inset:0;z-index:50;background:rgba(3,5,14,.72);backdrop-filter:blur(13px);display:grid;place-items:center;text-align:center;padding:25px;transition:.9s}.veil.gone{opacity:0;pointer-events:none}.welcome{max-width:500px}.welcome h1{font-size:clamp(40px,10vw,76px);margin:10px 0;color:#fff;text-shadow:0 0 24px #ff4b9c}.welcome p{font-size:18px;line-height:1.5}.open{border:1px solid #ff9ac8;background:#ff3e8f;color:white;border-radius:999px;padding:17px 26px;font-weight:800;font-size:17px;box-shadow:0 0 30px #ff3e8f88}.tip{position:fixed;z-index:20;top:15px;left:50%;transform:translateX(-50%);background:#070a16cc;border:1px solid #ffffff33;border-radius:999px;padding:9px 15px;font-size:12px;backdrop-filter:blur(10px);transition:.5s}.music{position:fixed;z-index:25;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;border:1px solid #ffffff35;background:#080b16aa;color:#ffffffaa;font-size:12px;opacity:.42;box-shadow:none;transition:.25s}.music:hover,.music:active{opacity:.9;transform:scale(1.08)}.hot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:8;padding:0}.hot:after{content:"";position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;opacity:0;box-shadow:0 0 18px 5px #ff5ba599;transition:.2s}.hot:active:after,.hot.active:after{opacity:1;background:#fff2}.h1{left:58.7%;top:22.5%;width:12%;height:7%}.h2{left:58.7%;top:30%;width:12%;height:7%}.h3{left:58.7%;top:37.4%;width:12%;height:7%}.h4{left:58.7%;top:44.9%;width:12%;height:7%}.h5{left:58.7%;top:52.4%;width:12%;height:7%}.h6{left:58.7%;top:59.9%;width:12%;height:7%}.h7{left:58.7%;top:67.4%;width:12%;height:7%}.h8{left:58.7%;top:74.9%;width:12%;height:7%}.titleGlow{position:absolute;left:3%;top:3%;width:48%;height:18%;pointer-events:none;border-radius:50%;animation:title 2.4s ease-in-out infinite}.heartFloat{position:absolute;z-index:7;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 8px #ff4e9a);font-size:clamp(14px,3vw,30px)}.f1{left:47%;top:20%}.f2{left:33%;top:25%;animation-delay:.7s}.f3{left:49%;top:47%;animation-delay:1.2s}.modal{position:fixed;z-index:40;left:50%;bottom:24px;transform:translate(-50%,120%);width:min(90%,470px);padding:22px;background:#090c19ed;border:1px solid #ffffff35;border-radius:25px;backdrop-filter:blur(18px);box-shadow:0 20px 70px #000,0 0 30px #ff4e9a33;transition:.45s}.modal.show{transform:translate(-50%,0)}.modal .emoji{font-size:42px}.modal h2{margin:8px 0}.modal p{color:#ddd;line-height:1.5;margin-bottom:5px}.close{position:absolute;right:14px;top:12px;border:0;background:#ffffff15;color:white;width:34px;height:34px;border-radius:50%;font-size:18px}.spark{position:fixed;pointer-events:none;z-index:60;animation:fall 2.8s linear forwards}@keyframes pulse{70%{box-shadow:0 0 0 13px transparent}}@keyframes title{50%{box-shadow:0 0 60px 16px #ff4c9c33}}@keyframes float{50%{transform:translateY(-10px) scale(1.15)}}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}@media(max-width:600px){.tip{top:8px;font-size:10px}.hot:after{inset:0}.music{width:48px;height:48px}.modal{bottom:12px}}</style></head>
<body><audio id="song" src="music.mp3" preload="auto" loop></audio>
<div class="veil" id="veil"><div class="welcome"><div style="font-size:52px">💌</div><h1>Kristine…</h1><p>I made something for you.<br><b>Turn your sound on.</b> Then touch the glowing moments to discover our day. ❤️</p><button class="open" id="open">Open Our Anniversary ✨</button></div></div>
<div class="tip" id="tip">✨ Tap an itinerary icon</div><button class="music" id="music">♫</button>
<div class="stage" id="stage"><div class="titleGlow"></div><span class="heartFloat f1">♥</span><span class="heartFloat f2">♥</span><span class="heartFloat f3">♥</span>
<button class="hot h1" data-i="0" aria-label="Interview"></button><button class="hot h2" data-i="1" aria-label="Train"></button><button class="hot h3" data-i="2" aria-label="Lunch"></button><button class="hot h4" data-i="3" aria-label="Grand Place"></button><button class="hot h5" data-i="4" aria-label="Chocolate"></button><button class="hot h6" data-i="5" aria-label="Bowling"></button><button class="hot h7" data-i="6" aria-label="Dinner"></button><button class="hot h8" data-i="7" aria-label="Night"></button></div>
<div class="modal" id="modal"><button class="close" id="close">×</button><div class="emoji" id="emoji"></div><h2 id="mh"></h2><p id="mp"></p></div>
<script>
const data=[
["💼","10:00 • Tiny mission first","Just 15 minutes for my interview. When it ends, work disappears and our anniversary adventure officially begins. ❤️"],
["🚆","11:30 • Brussels, here we come","Namur → Brussels. Sit next to me, relax, listen to our song and let’s go make another memory together."],
["🍴","13:00 • Lunch in the city","Good food, better company. Nothing rushed — just you and me enjoying Brussels."],
["📸","14:00 • Grand-Place & Galeries","We explore, walk and take photos together. Cute couple pictures are mandatory. No appeals accepted. 😏"],
["🍫","15:30 • A sweet surprise","We’re making something together with our own hands. And yes… it involves chocolate. ❤️"],
["🎳","17:30 • Husband vs Wife","Bowling time! Official rule: the loser owes the winner one very serious anniversary kiss. 🎳💋"],
["🍽️","19:30 • Dinner","A nice dinner to celebrate us. No scores, no competition — just my favorite person across the table."],
["✨","20:45 • Brussels after dark","Grand-Place under the lights, something sweet and one last walk before we head home together. ❤️"]
];const song=document.querySelector('#song'),veil=document.querySelector('#veil'),music=document.querySelector('#music'),modal=document.querySelector('#modal');song.volume=0;
function fade(){song.play().then(()=>{let v=0;let x=setInterval(()=>{v=Math.min(.38,v+.015);song.volume=v;if(v>=.38)clearInterval(x)},80)}).catch(()=>music.textContent='▶')}
function sparkle(n=22){for(let i=0;i<n;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','♥','✦'][Math.floor(Math.random()*3)];s.style.left=Math.random()*100+'vw';s.style.top='-20px';s.style.animationDelay=Math.random()*.4+'s';s.style.fontSize=12+Math.random()*18+'px';document.body.append(s);setTimeout(()=>s.remove(),3500)}}
document.querySelector('#open').onclick=()=>{fade();veil.classList.add('gone');sparkle(40);setTimeout(()=>veil.style.display='none',950)};
document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.hot').forEach(x=>x.classList.remove('active'));b.classList.add('active');let d=data[+b.dataset.i];document.querySelector('#emoji').textContent=d[0];document.querySelector('#mh').textContent=d[1];document.querySelector('#mp').textContent=d[2];modal.classList.add('show');sparkle(10)});
document.querySelector('#close').onclick=()=>modal.classList.remove('show');
music.onclick=()=>{if(song.paused){song.play();music.textContent='♫'}else{song.pause();music.textContent='▶'}};
setTimeout(()=>document.querySelector('#tip').style.opacity='.35',7000);
</script></body></html>
